function buildTree(rows) {
  const companies = [];
  let curCia = null, curCod = null;
  for (const raw of rows) {
    const [dgs="",nombre="",codigo="",agente="",eiac=""] = raw.map(v=>(v??'').toString());
    const hasCia = dgs.trim()!=='' || nombre.trim()!=='';
    const hasCod = codigo.trim()!=='';
    if (hasCia && hasCod) {
      const last = companies[companies.length-1];
      if (last && last.dgs===dgs.trim() && last.nombre===nombre.trim() && dgs.trim()!=='') { curCia=last; }
      else { curCia={dgs:dgs.trim(),nombre:nombre.trim(),codigos:[]}; companies.push(curCia); }
      curCod={codigo:codigo.trim(),filas:[]};
      curCia.codigos.push(curCod);
      if(agente.trim()||eiac.trim()) curCod.filas.push({agente:agente.trim(),eiac:eiac.trim()});
    } else if(!hasCia && hasCod) {
      curCod={codigo:codigo.trim(),filas:[]};
      if(curCia) curCia.codigos.push(curCod);
      if(agente.trim()||eiac.trim()) curCod.filas.push({agente:agente.trim(),eiac:eiac.trim()});
    } else if(!hasCia && !hasCod) {
      if(curCod&&(agente.trim()||eiac.trim())) curCod.filas.push({agente:agente.trim(),eiac:eiac.trim()});
    } else {
      const last=companies[companies.length-1];
      if(last&&last.dgs===dgs.trim()&&last.nombre===nombre.trim()&&dgs.trim()!==''){curCia=last;}
      else{curCia={dgs:dgs.trim(),nombre:nombre.trim(),codigos:[]};companies.push(curCia);}
      curCod=null;
    }
  }
  return companies;
}

function detectAnomalies(tree) {
  const issues=[], allCod=new Map(), allEiac=new Map();
  tree.forEach(cia=>{
    cia.codigos.forEach(cod=>{
      if(!allCod.has(cod.codigo)) allCod.set(cod.codigo,[]);
      allCod.get(cod.codigo).push(cia.nombre);
      if(cod.filas.length===0) issues.push({type:'warn',label:'Sin agente/EIAC',desc:`Código "${cod.codigo}" en "${cia.nombre}" no tiene AGENTE ni EIAC.`});
      cod.filas.forEach(f=>{
        if(f.agente&&['1','0','?'].includes(f.agente.trim())) issues.push({type:'warn',label:'AGENTE genérico',desc:`"${cod.codigo}" en "${cia.nombre}" tiene AGENTE="${f.agente}".`});
        if(f.agente&&f.agente.includes('?')) issues.push({type:'warn',label:'AGENTE con "?"',desc:`"${cod.codigo}" en "${cia.nombre}": AGENTE="${f.agente}".`});
        if(f.eiac){if(!allEiac.has(f.eiac))allEiac.set(f.eiac,[]);allEiac.get(f.eiac).push(`${cia.nombre}/${cod.codigo}`);}
        if(f.agente&&(f.agente.split('/').length>2||f.agente.includes('+'))) issues.push({type:'info',label:'AGENTE múltiple',desc:`"${cod.codigo}" en "${cia.nombre}": AGENTE compuesto "${f.agente}".`});
      });
      const n=new Set(cod.filas.map(f=>f.eiac).filter(Boolean)).size;
      if(n>20) issues.push({type:'info',label:'Muchos EIAC',desc:`"${cod.codigo}" en "${cia.nombre}" tiene ${n} EIAC distintos.`});
    });
    if(!cia.dgs||/^0+$/.test(cia.dgs)) issues.push({type:'warn',label:'Sin DGS',desc:`"${cia.nombre}" no tiene código DGS válido.`});
    if(cia.nombre&&cia.nombre!==cia.nombre.toUpperCase()&&cia.nombre.length>5){
      if((cia.nombre.match(/[a-z]/g)||[]).length>3) issues.push({type:'info',label:'Nombre minúsculas',desc:`"${cia.nombre}" tiene formato en minúsculas.`});
    }
  });
  allCod.forEach((cias,cod)=>{ const u=[...new Set(cias)]; if(u.length>1) issues.push({type:'error',label:'Código CIA duplicado',desc:`"${cod}" aparece en ${u.length} compañías: ${u.slice(0,3).join(', ')}${u.length>3?'...':''}.`}); });
  allEiac.forEach((usos,eiac)=>{ if(usos.length>3) issues.push({type:'info',label:'EIAC reutilizado',desc:`EIAC "${eiac}" aparece en ${usos.length} códigos.`}); });
  return issues;
}

const COLORS={C:"#3B82F6",E:"#8B5CF6",M:"#10B981",J:"#F59E0B",L:"#EF4444",R:"#EC4899","0":"#6B7280"};
const LEGEND=[{p:"C",l:"Compañía"},{p:"E",l:"Sucursal ext."},{p:"M",l:"Mutua"},{p:"J",l:"Corredor"},{p:"L",l:"Extranjera"},{p:"0",l:"Sin clasificar"}];
const SEV={error:{bg:'#fef2f2',border:'#fecaca',dot:'#ef4444',label:'Error'},warn:{bg:'#fffbeb',border:'#fde68a',dot:'#f59e0b',label:'Aviso'},info:{bg:'#eff6ff',border:'#bfdbfe',dot:'#3b82f6',label:'Info'}};
function getColor(d){if(!d||/^0+$/.test(d))return COLORS["0"];return COLORS[d[0]]||COLORS["0"];}

function CodigoNode({cod,search}){
  const [open,setOpen]=useState(false);
  const agentes=[...new Set(cod.filas.map(f=>f.agente).filter(Boolean))];
  const eiacs=[...new Set(cod.filas.map(f=>f.eiac).filter(Boolean))];
  const has=cod.filas.length>0;
  if(search){const s=search.toLowerCase();if(!cod.codigo.toLowerCase().includes(s)&&!agentes.some(a=>a.toLowerCase().includes(s))&&!eiacs.some(e=>e.toLowerCase().includes(s)))return null;}
  return <div style={{marginBottom:3}}>
    <div onClick={()=>has&&setOpen(o=>!o)} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:6,cursor:has?'pointer':'default',background:open?'#f0f9ff':'#f8fafc',border:'1px solid '+(open?'#bae6fd':'#e2e8f0')}}>
      {has?<span style={{fontSize:11,color:'#64748b',width:10}}>{open?'▼':'▶'}</span>:<span style={{width:10}}/>}
      <span style={{background:'#e0f2fe',color:'#0369a1',borderRadius:4,padding:'1px 7px',fontSize:11,fontFamily:'monospace',fontWeight:700}}>{cod.codigo}</span>
      {agentes.length>0&&<span style={{fontSize:11,color:'#64748b'}}>{agentes.join(' / ')}</span>}
      {has&&<span style={{fontSize:10,color:'#94a3b8',marginLeft:'auto'}}>{eiacs.length} EIAC</span>}
    </div>
    {open&&has&&<div style={{marginLeft:28,marginTop:2,padding:'6px 10px',background:'#f0fdf4',borderRadius:6,border:'1px solid #bbf7d0'}}>
      <div style={{display:'flex',gap:24,flexWrap:'wrap'}}>
        {agentes.length>0&&<div><div style={{fontSize:10,color:'#94a3b8',marginBottom:3,fontWeight:600,textTransform:'uppercase',letterSpacing:1}}>AGENTE</div>{agentes.map((a,i)=><div key={i} style={{fontFamily:'monospace',fontSize:12,color:'#166534',background:'#dcfce7',borderRadius:3,padding:'1px 6px',marginBottom:2,display:'inline-block',marginRight:4}}>{a}</div>)}</div>}
        {eiacs.length>0&&<div><div style={{fontSize:10,color:'#94a3b8',marginBottom:3,fontWeight:600,textTransform:'uppercase',letterSpacing:1}}>AGENTE_EIAC</div><div style={{display:'flex',flexWrap:'wrap',gap:3}}>{eiacs.map((e,i)=><span key={i} style={{fontFamily:'monospace',fontSize:11,color:'#1e3a5f',background:'#dbeafe',borderRadius:3,padding:'1px 6px'}}>{e}</span>)}</div></div>}
      </div>
    </div>}
  </div>;
}

function CompanyNode({cia,search}){
  const [open,setOpen]=useState(false);
  const color=getColor(cia.dgs);
  const cods=useMemo(()=>{
    if(!search)return cia.codigos;
    const s=search.toLowerCase();
    return cia.codigos.filter(c=>c.codigo.toLowerCase().includes(s)||c.filas.some(f=>f.agente.toLowerCase().includes(s)||f.eiac.toLowerCase().includes(s)));
  },[search,cia]);
  if(search&&!cia.nombre.toLowerCase().includes(search.toLowerCase())&&cods.length===0)return null;
  const eiac=cia.codigos.reduce((a,c)=>a+new Set(c.filas.map(f=>f.eiac).filter(Boolean)).size,0);
  return <div style={{marginBottom:8}}>
    <div onClick={()=>setOpen(o=>!o)} style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',padding:'8px 12px',borderRadius:8,background:open?color+'18':'#f8fafc',border:`1.5px solid ${open?color:'#e2e8f0'}`,transition:'all 0.15s'}}>
      <span style={{fontSize:12,color,fontWeight:700}}>{open?'▼':'▶'}</span>
      <span style={{background:color+'22',color,border:`1px solid ${color}55`,borderRadius:4,padding:'1px 6px',fontSize:11,fontWeight:700,fontFamily:'monospace'}}>{cia.dgs||'–'}</span>
      <span style={{fontWeight:600,fontSize:13,color:'#1e293b',flex:1}}>{cia.nombre}</span>
      <span style={{fontSize:11,color:'#94a3b8',whiteSpace:'nowrap'}}>{cia.codigos.length} cód · {eiac} EIAC</span>
    </div>
    {open&&<div style={{marginLeft:20,marginTop:4,paddingLeft:12,borderLeft:`2px solid ${color}55`}}>
      {(search?cods:cia.codigos).map((c,i)=><CodigoNode key={i} cod={c} search={search}/>)}
    </div>}
  </div>;
}

function Bar({items,color}){
  const max=items[0]?.val||1;
  return <div>{items.map((it,i)=><div key={i} style={{marginBottom:6}}>
    <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:2}}>
      <span style={{color:'#334155',fontWeight:i===0?700:400,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:200}}>{it.label}</span>
      <span style={{color,fontWeight:700,marginLeft:8}}>{it.val}</span>
    </div>
    <div style={{height:6,background:'#f1f5f9',borderRadius:3}}><div style={{height:6,width:`${(it.val/max)*100}%`,background:color,borderRadius:3}}/></div>
  </div>)}</div>;
}

function Kpi({label,value,sub,color="#3B82F6"}){
  return <div style={{background:'#fff',border:'1.5px solid #e2e8f0',borderRadius:10,padding:'12px 16px',flex:1,minWidth:110}}>
    <div style={{fontSize:22,fontWeight:800,color}}>{value}</div>
    <div style={{fontSize:12,fontWeight:600,color:'#1e293b',marginTop:2}}>{label}</div>
    {sub&&<div style={{fontSize:11,color:'#94a3b8',marginTop:2}}>{sub}</div>}
  </div>;
}

function App(){
  const [tab,setTab]=useState('tree');
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('todas');
  const [af,setAf]=useState('all');
  const tree=useMemo(()=>buildTree(rows),[]);
  const anom=useMemo(()=>detectAnomalies(tree),[tree]);
  const stats=useMemo(()=>{
    const totalCias=tree.length;
    const totalCod=tree.reduce((a,c)=>a+c.codigos.length,0);
    const totalEiac=tree.reduce((a,c)=>a+c.codigos.reduce((b,cod)=>b+new Set(cod.filas.map(f=>f.eiac).filter(Boolean)).size,0),0);
    const codSinEiac=tree.reduce((a,c)=>a+c.codigos.filter(cod=>cod.filas.filter(f=>f.eiac).length===0).length,0);
    const byType={};
    tree.forEach(c=>{const p=(!c.dgs||/^0+$/.test(c.dgs))?'0':c.dgs[0];byType[p]=(byType[p]||0)+1;});
    const rankCod=[...tree].sort((a,b)=>b.codigos.length-a.codigos.length).slice(0,8).map(c=>({label:c.nombre.length>30?c.nombre.slice(0,28)+'…':c.nombre,val:c.codigos.length}));
    const rankEiac=[...tree].sort((a,b)=>{
      const ea=a.codigos.reduce((s,cod)=>s+new Set(cod.filas.map(f=>f.eiac).filter(Boolean)).size,0);
      const eb=b.codigos.reduce((s,cod)=>s+new Set(cod.filas.map(f=>f.eiac).filter(Boolean)).size,0);
      return eb-ea;
    }).slice(0,8).map(c=>({label:c.nombre.length>30?c.nombre.slice(0,28)+'…':c.nombre,val:c.codigos.reduce((s,cod)=>s+new Set(cod.filas.map(f=>f.eiac).filter(Boolean)).size,0)}));
    const codRank=[];
    tree.forEach(cia=>cia.codigos.forEach(cod=>{const n=new Set(cod.filas.map(f=>f.eiac).filter(Boolean)).size;if(n>0)codRank.push({label:`${cod.codigo} (${cia.nombre.split(' ')[0]})`,val:n});}));
    codRank.sort((a,b)=>b.val-a.val);
    return {totalCias,totalCod,totalEiac,codSinEiac,byType,rankCod,rankEiac,codRank:codRank.slice(0,8)};
  },[tree]);
  const filtered=useMemo(()=>tree.filter(cia=>{
    if(filter!=='todas'){const p=(!cia.dgs||/^0+$/.test(cia.dgs))?'0':cia.dgs[0];if(filter==='C'&&p!=='C')return false;if(filter==='E'&&p!=='E')return false;if(filter==='M'&&p!=='M')return false;if(filter==='otros'&&['C','E','M'].includes(p))return false;}
    if(search){const s=search.toLowerCase();if(cia.nombre.toLowerCase().includes(s)||cia.dgs.toLowerCase().includes(s))return true;return cia.codigos.some(c=>c.codigo.toLowerCase().includes(s)||c.filas.some(f=>f.agente.toLowerCase().includes(s)||f.eiac.toLowerCase().includes(s)));}
    return true;
  }),[tree,search,filter]);
  const filtAnom=af==='all'?anom:anom.filter(a=>a.type===af);
  const tabSt=(t)=>({padding:'8px 18px',borderRadius:8,border:'none',cursor:'pointer',fontWeight:600,fontSize:13,background:tab===t?'#3B82F6':'#f1f5f9',color:tab===t?'#fff':'#475569'});
  return <div style={{fontFamily:'system-ui,sans-serif',padding:20,maxWidth:980,margin:'0 auto'}}>
    <div style={{marginBottom:14}}>
      <h2 style={{margin:0,fontSize:20,color:'#0f172a'}}>🌳 Árbol de Claves EIAC</h2>
      <p style={{margin:'2px 0 0',color:'#64748b',fontSize:13}}>{tree.length} compañías · {stats.totalCod} códigos CIA · {stats.totalEiac} claves EIAC</p>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:18}}>
      <button style={tabSt('tree')} onClick={()=>setTab('tree')}>🌳 Árbol</button>
      <button style={tabSt('kpi')} onClick={()=>setTab('kpi')}>📊 KPIs & Rankings</button>
      <button style={tabSt('anom')} onClick={()=>setTab('anom')}>
        ⚠️ Anomalías <span style={{marginLeft:6,background:'#ef4444',color:'#fff',borderRadius:10,padding:'1px 7px',fontSize:11}}>{anom.filter(a=>a.type==='error').length+anom.filter(a=>a.type==='warn').length}</span>
      </button>
    </div>

    {tab==='tree'&&<>
      <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>
        {LEGEND.map(({p,l})=><span key={p} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'#64748b'}}><span style={{width:10,height:10,borderRadius:2,background:COLORS[p]||COLORS['0'],display:'inline-block'}}/>{l}</span>)}
      </div>
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar compañía, código CIA, AGENTE o AGENTE_EIAC..." style={{flex:1,minWidth:220,padding:'7px 12px',borderRadius:7,border:'1.5px solid #e2e8f0',fontSize:13}}/>
        <select value={filter} onChange={e=>setFilter(e.target.value)} style={{padding:'7px 10px',borderRadius:7,border:'1.5px solid #e2e8f0',fontSize:13}}>
          <option value="todas">Todas</option><option value="C">Compañías (C)</option><option value="E">Sucursales (E)</option><option value="M">Mutuas (M)</option><option value="otros">Otros</option>
        </select>
      </div>
      {filtered.length===0?<div style={{textAlign:'center',color:'#94a3b8',padding:40}}>Sin resultados para "{search}"</div>:filtered.map((c,i)=><CompanyNode key={i} cia={c} search={search}/>)}
    </>}

    {tab==='kpi'&&<>
      <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:20}}>
        <Kpi label="Compañías" value={stats.totalCias} sub="entidades distintas" color="#3B82F6"/>

        <Kpi label="Claves EIAC" value={stats.totalEiac} sub="identificadores EIAC" color="#10B981"/>
        <Kpi label="Cód. sin EIAC" value={stats.codSinEiac} sub={`${((stats.codSinEiac/stats.totalCod)*100).toFixed(0)}% del total`} color="#F59E0B"/>
        <Kpi label="Anomalías" value={anom.length} sub={`${anom.filter(a=>a.type==='error').length} errores`} color="#EF4444"/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
        <div style={{background:'#fff',border:'1.5px solid #e2e8f0',borderRadius:10,padding:16}}>
          <div style={{fontWeight:700,fontSize:13,color:'#1e293b',marginBottom:12}}>🏆 Top compañías por códigos CIA</div>
          <Bar items={stats.rankCod} color="#3B82F6"/>
        </div>
        <div style={{background:'#fff',border:'1.5px solid #e2e8f0',borderRadius:10,padding:16}}>
          <div style={{fontWeight:700,fontSize:13,color:'#1e293b',marginBottom:12}}>🏆 Top compañías por claves EIAC</div>
          <Bar items={stats.rankEiac} color="#10B981"/>
        </div>
      </div>
      <div style={{background:'#fff',border:'1.5px solid #e2e8f0',borderRadius:10,padding:16,marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:13,color:'#1e293b',marginBottom:12}}>🔑 Top códigos CIA con más EIAC</div>
        <Bar items={stats.codRank} color="#8B5CF6"/>
      </div>
      <div style={{background:'#fff',border:'1.5px solid #e2e8f0',borderRadius:10,padding:16}}>
        <div style={{fontWeight:700,fontSize:13,color:'#1e293b',marginBottom:12}}>📋 Distribución por tipo de entidad</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:10}}>
          {Object.entries(stats.byType).sort((a,b)=>b[1]-a[1]).map(([p,n])=>(
            <div key={p} style={{display:'flex',alignItems:'center',gap:8,background:'#f8fafc',borderRadius:8,padding:'8px 14px',border:'1px solid #e2e8f0'}}>
              <span style={{width:12,height:12,borderRadius:3,background:COLORS[p]||COLORS['0'],display:'inline-block'}}/>
              <span style={{fontSize:12,color:'#475569'}}>{LEGEND.find(l=>l.p===p)?.l||p}</span>
              <span style={{fontWeight:700,fontSize:14,color:COLORS[p]||COLORS['0']}}>{n}</span>
            </div>
          ))}
        </div>
      </div>
    </>}

    {tab==='anom'&&<>
      <div style={{display:'flex',gap:8,marginBottom:14}}>
        {['all','error','warn','info'].map(t=>(
          <button key={t} onClick={()=>setAf(t)} style={{padding:'6px 14px',borderRadius:7,border:'1.5px solid #e2e8f0',cursor:'pointer',fontWeight:600,fontSize:12,background:af===t?'#1e293b':'#f8fafc',color:af===t?'#fff':'#475569'}}>
            {t==='all'?'Todos':SEV[t]?.label} ({t==='all'?anom.length:anom.filter(a=>a.type===t).length})
          </button>
        ))}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {filtAnom.length===0&&<div style={{textAlign:'center',color:'#94a3b8',padding:40}}>No hay anomalías de este tipo.</div>}
        {filtAnom.map((a,i)=>{const s=SEV[a.type];return(
          <div key={i} style={{background:s.bg,border:`1.5px solid ${s.border}`,borderRadius:8,padding:'10px 14px',display:'flex',gap:10,alignItems:'flex-start'}}>
            <span style={{width:8,height:8,borderRadius:'50%',background:s.dot,marginTop:5,flexShrink:0}}/>
            <div><span style={{fontWeight:700,fontSize:12,color:s.dot}}>{a.label}</span><span style={{fontSize:12,color:'#475569',marginLeft:8}}>{a.desc}</span></div>
          </div>
        );})}
